spring:
  datasource:
    url: default
    username: default
    password: default

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_
    job:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms      

quarter: default
year: default
executor: default
benchmark:
  regex: '\s*\(reflects no deduction for [^)]*\)'
  suffix-regex: '(?i)(\s*\[Member\]|Member)$'
  narrative:
    regex: '(?:broad(?:-|\s+)based\s+(?:securities\s+)?market\s+index|broad\s+measure\s+of\s+market\s+performance|compare(?:d|s)?\s+(?:with|to)\s+(?:those\s+of\s+)?)(?:,\s*the|\s+the)?\s+([A-Z0-9][A-Za-z0-9&/.,\-\s]{3,70}?)(?:\s*\(reflects|\s*,?\s*which\s+reflects|\s*\.|\s*,\s*and\b|\s*\band\b)'
  default:
    id: 0