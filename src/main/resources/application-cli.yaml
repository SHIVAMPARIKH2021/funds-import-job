spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  datasource:
    url: default
    username: default
    password: default

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_
    job:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

quarter: default
year: default
executor: default

benchmark:
  transition-regex: '(?i)(?:index|benchmark)\s+(?:has\s+)?changed\s+from\s+.+?\s+to\s+(?:the\s+)?(.+?)(?:\s*,|\s*\(|\s*\.\s*$)'
  regex: '(?i)\s*\((?:(?:(?:Index|the)\s+)?(?:returns?\s+)?(?:reflects?|do(?:es)?\s+not\s+reflect)|no\s+deductions?)\b[^)]*\)'
  suffix-regex: '(?i)(\s*\[Member\]|Member)$'
  garbage-regex: '(?i)(?:^[0-9.,%$* -]+$|^\d{1,2}/\d{1,2}/\d{2,4}$|^(?:19|20)\d{2}$|^\d{1,2}[\s-]*(?:years?|yrs?)$|^(?:since\s+inception|life\s+of\s+fund)$|^C\d{8,10}$|^(?:Index)?(?:[A-Z]{1,6}\d{1,5}|Index\d+)(?:Member)?$|^IX[A-Z0-9]{3,5}$|^[A-Z]{2,6}Index\d+$|after[\s-]?tax|before[\s-]?tax|return\s+(?:with|without)\s+a\s+sales\s+load|KavinGety|IndexNoDeduction|PerformanceTable|AverageAnnual|AvgAnnlRtr|fee\s+waiver|operating\s+expense|12b-1|management\s+fee|redemption\s+fee|^(?:maximum\s+|deferred\s+)?sales\s+charge|deferred\s+sales|^class\s+[a-z0-9]+$|^(?:advisor|investor|institutional|retail|admiral)\s+(?:class|shares)$)'

  provider:
    regex: '(?i).*\b(s&p|msci|russell|nasdaq|ftse|morningstar|wilshire|ice|bloomberg)\b.*'

  narrative:
    regex: '(?:broad(?:-|\s+)based\s+(?:securities\s+)?market\s+index|broad\s+measure\s+of\s+market\s+performance|compare(?:d|s)?\s+(?:with|to)\s+(?:those\s+of\s+)?)(?:,\s*the|\s+the)?\s+([A-Z0-9][A-Za-z0-9&/.,\-\s]{3,70}?)(?:\s*\(reflects|\s*,?\s*which\s+reflects|(?:\.\s+|\.$)|\s*,\s*and\b|\s*\band\b)'
  default:
    id: 0

fund:
  strategy:
    active:
      regex: '.*\b(active|actively managed|active etf|active fund|unconstrained|discretionary)\b.*'

    passive:
      regex: '.*\b(index fund|idx fund|index etf|idx etf|tracker|tracking|index portfolio)\b.*'

  index:
    regex: '(?i).*\b(index|idx)\b.*'